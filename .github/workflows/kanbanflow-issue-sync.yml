name: KanbanFlow Issue Sync

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled
      - closed
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: kanbanflow-issue-sync-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  sync-issue-to-kanbanflow:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Sync issue to KanbanFlow
        uses: actions/github-script@v8
        env:
          KANBANFLOW_API_TOKEN: ${{ secrets.KANBANFLOW_API_TOKEN }}
          KANBANFLOW_DEFAULT_COLUMN_ID: ${{ vars.KANBANFLOW_DEFAULT_COLUMN_ID }}
          KANBANFLOW_DEFAULT_COLUMN_NAME: ${{ vars.KANBANFLOW_DEFAULT_COLUMN_NAME }}
          KANBANFLOW_DONE_COLUMN_ID: ${{ vars.KANBANFLOW_DONE_COLUMN_ID }}
          KANBANFLOW_DONE_COLUMN_NAME: ${{ vars.KANBANFLOW_DONE_COLUMN_NAME }}
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action || "workflow_dispatch";
            const token = process.env.KANBANFLOW_API_TOKEN;
            const defaultColumnId = process.env.KANBANFLOW_DEFAULT_COLUMN_ID;
            const defaultColumnName = process.env.KANBANFLOW_DEFAULT_COLUMN_NAME;
            const doneColumnId = process.env.KANBANFLOW_DONE_COLUMN_ID;
            const doneColumnName = process.env.KANBANFLOW_DONE_COLUMN_NAME;

            if (!token) {
              core.setFailed("Missing Actions secret: KANBANFLOW_API_TOKEN");
              return;
            }

            if (!issue) {
              core.setFailed("This workflow expects an issue payload.");
              return;
            }

            if (!defaultColumnId && !defaultColumnName && action !== "closed") {
              core.setFailed("Missing Actions variable: KANBANFLOW_DEFAULT_COLUMN_ID or KANBANFLOW_DEFAULT_COLUMN_NAME");
              return;
            }

            const repoName = context.repo.repo;
            const repoSlug = `${context.repo.owner}/${context.repo.repo}`;
            const issueRefLabel = `GitHub #${issue.number}`;
            const issueLabels = (issue.labels || [])
              .map((label) => typeof label === "string" ? label : label.name)
              .filter(Boolean);
            const milestoneLabel = issue.milestone?.title?.trim();

            function labelName(label) {
              return typeof label === "string" ? label : label?.name;
            }

            function dedupe(values) {
              return [...new Set(values.filter(Boolean))];
            }

            function matches(labels, patterns) {
              const normalized = labels.map((label) => label.toLowerCase());
              return patterns.some((pattern) => normalized.some((label) => label.includes(pattern)));
            }

            function deriveColor(labels) {
              if (matches(labels, ["p0", "blocker", "risk-high", "security", "urgent"])) {
                return "red";
              }
              if (matches(labels, ["p1", "critical", "high-priority"])) {
                return "orange";
              }
              if (matches(labels, ["p2", "important", "risk-medium"])) {
                return "yellow";
              }
              if (matches(labels, ["test", "testing", "qa"])) {
                return "cyan";
              }
              if (matches(labels, ["design", "marketing", "launch", "copy", "social"])) {
                return "purple";
              }
              if (matches(labels, ["feature", "enhancement", "product"])) {
                return "green";
              }
              if (matches(labels, ["habit", "weekly goal", "routine"])) {
                return "blue";
              }
              return "white";
            }

            function normalizeText(value) {
              return (value || "")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, " ")
                .trim();
            }

            function findWeekdayColumnName(labels) {
              const routingTargets = [
                "Sunday",
                "Monday",
                "Tuesday",
                "Wednesday",
                "Thursday",
                "Friday",
                "Saturday",
                "Next week",
                "In Progress",
              ];

              const normalizedLabels = labels.map(normalizeText);

              for (const target of routingTargets) {
                const normalizedTarget = normalizeText(target);
                const matched = normalizedLabels.some((label) => {
                  return label === normalizedTarget || label.includes(normalizedTarget);
                });

                if (matched) {
                  return target;
                }
              }

              return null;
            }

            function isWeekdayRoutingLabel(label) {
              return findWeekdayColumnName([label]) !== null;
            }

            function extractSubtasks(body) {
              const lines = (body || "").split("\n");
              return lines
                .map((line) => line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))
                .filter(Boolean)
                .map((match) => ({
                  name: match[2].trim(),
                  finished: match[1].toLowerCase() === "x",
                }));
            }

            function formatDescription() {
              const metadata = [
                `Source: ${repoSlug}#${issue.number}`,
                `URL: ${issue.html_url}`,
                `State: ${issue.state}`,
              ];

              if (milestoneLabel) {
                metadata.push(`Milestone: ${milestoneLabel}`);
              }

              if (issueLabels.length > 0) {
                metadata.push(`Labels: ${issueLabels.join(", ")}`);
              }

              const body = (issue.body || "").trim();
              return `${metadata.join("\n")}\n\n${body || "No description provided."}`;
            }

            async function kanbanflow(path, options = {}) {
              const response = await fetch(`https://kanbanflow.com/api/v1${path}`, {
                method: options.method || "GET",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: options.body,
              });

              const text = await response.text();
              let data = null;

              if (text) {
                try {
                  data = JSON.parse(text);
                } catch (error) {
                  data = text;
                }
              }

              if (!response.ok) {
                throw new Error(`KanbanFlow ${response.status}: ${typeof data === "string" ? data : JSON.stringify(data)}`);
              }

              return data;
            }

            function collectColumns(node, columns = []) {
              if (!node) {
                return columns;
              }

              if (Array.isArray(node)) {
                for (const item of node) {
                  collectColumns(item, columns);
                }
                return columns;
              }

              if (typeof node === "object") {
                const id = node.uniqueId || node._id || node.id;
                if (id && node.name && !Array.isArray(node.labels) && !Object.prototype.hasOwnProperty.call(node, "columnId")) {
                  columns.push({
                    id,
                    name: node.name,
                  });
                }

                for (const value of Object.values(node)) {
                  collectColumns(value, columns);
                }
              }

              return columns;
            }

            let boardCache = null;

            async function getBoard() {
              if (!boardCache) {
                boardCache = await kanbanflow("/board");
              }
              return boardCache;
            }

            async function resolveColumnId(preferredId, preferredName, variableName) {
              if (preferredId) {
                return preferredId;
              }

              if (!preferredName) {
                return null;
              }

              const board = await getBoard();
              const columns = collectColumns(board);
              const normalizedTarget = normalizeText(preferredName);
              const exactMatch = columns.find((column) => normalizeText(column.name) === normalizedTarget);

              if (exactMatch) {
                core.info(`Resolved ${variableName} "${preferredName}" -> ${exactMatch.id}`);
                return exactMatch.id;
              }

              const partialMatch = columns.find((column) => normalizeText(column.name).includes(normalizedTarget));

              if (!partialMatch) {
                throw new Error(`KanbanFlow column not found for ${variableName}: "${preferredName}"`);
              }

              core.info(`Resolved ${variableName} "${preferredName}" -> ${partialMatch.id}`);
              return partialMatch.id;
            }

            function collectTasks(node, tasks = []) {
              if (!node) {
                return tasks;
              }

              if (Array.isArray(node)) {
                for (const item of node) {
                  collectTasks(item, tasks);
                }
                return tasks;
              }

              if (typeof node === "object") {
                if (node._id && node.name) {
                  tasks.push(node);
                }

                for (const value of Object.values(node)) {
                  collectTasks(value, tasks);
                }
              }

              return tasks;
            }

            const desiredLabels = dedupe([
              repoName,
              repoSlug,
              issueRefLabel,
              ...issueLabels.filter((label) => !isWeekdayRoutingLabel(label)),
              milestoneLabel,
            ]).map((name) => ({
              name,
              pinned: name === issueRefLabel,
            }));

            const payload = {
              name: `[${repoName.charAt(0).toUpperCase() + repoName.slice(1)}] #${issue.number} ${issue.title}`,
              color: deriveColor(issueLabels),
              description: formatDescription(),
              labels: desiredLabels,
              subTasks: extractSubtasks(issue.body),
            };

            if (issue.state === "closed") {
              payload.color = "green";
              const resolvedDoneColumnId = await resolveColumnId(
                doneColumnId,
                doneColumnName,
                "KANBANFLOW_DONE_COLUMN"
              );
              if (resolvedDoneColumnId) {
                payload.columnId = resolvedDoneColumnId;
              }
            } else {
              const weekdayColumnName = findWeekdayColumnName(issueLabels);

              if (weekdayColumnName) {
                payload.columnId = await resolveColumnId(
                  null,
                  weekdayColumnName,
                  "KANBANFLOW_WEEKDAY_COLUMN"
                );
              } else {
                payload.columnId = await resolveColumnId(
                  defaultColumnId,
                  defaultColumnName,
                  "KANBANFLOW_DEFAULT_COLUMN"
                );
              }
            }

            const allTasks = collectTasks(await kanbanflow("/tasks"));
            const existingTask = allTasks.find((task) => {
              const taskLabels = (task.labels || []).map(labelName).filter(Boolean);
              return taskLabels.includes(issueRefLabel) && (taskLabels.includes(repoSlug) || taskLabels.includes(repoName));
            });

            if (existingTask) {
              await kanbanflow(`/tasks/${existingTask._id}`, {
                method: "POST",
                body: JSON.stringify(payload),
              });
              core.info(`Updated KanbanFlow task ${existingTask._id} for ${repoSlug}#${issue.number}`);
              return;
            }

            if (action === "closed") {
              core.info("Issue closed before a KanbanFlow task existed. Nothing to create.");
              return;
            }

            const created = await kanbanflow("/tasks", {
              method: "POST",
              body: JSON.stringify(payload),
            });

            core.info(`Created KanbanFlow task ${created?.taskId || created?._id || "unknown"} for ${repoSlug}#${issue.number}`);
